name: Build Game Release & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run lint

      - name: Run game logic, SDK & i18n unit tests
        run: npm test

      - name: Build generic static bundle (Y8 / GamePix / itch.io / Pages)
        run: npm run build

      - name: Package game-portal-release.zip (Zero external SDK)
        working-directory: dist
        run: zip -r ../game-portal-release.zip .

      - name: Build CrazyGames SDK v3 bundle & package crazygames-release.zip
        run: |
          rm -rf dist-cg
          npm run build:crazygames
          (cd dist-cg && zip -r ../crazygames-release.zip .)

      - name: Verify Y8 & CrazyGames portal compliance
        run: |
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");

            const y8Html = fs.readFileSync("dist/index.html", "utf8");
            const cgHtml = fs.readFileSync("dist-cg/index.html", "utf8");

            if (y8Html.includes("crazygames-sdk-v3.js")) {
              throw new Error("Y8 / generic dist/index.html must NOT include CrazyGames SDK script");
            }
            if (!cgHtml.includes("https://sdk.crazygames.com/crazygames-sdk-v3.js")) {
              throw new Error("CrazyGames dist-cg/index.html must include crazygames-sdk-v3.js");
            }
            if (!y8Html.includes("./assets/") || !cgHtml.includes("./assets/")) {
              throw new Error("Production builds must use relative ./assets/ paths");
            }
            if (/https:\/\/fonts\.(googleapis|gstatic)\.com/.test(y8Html + cgHtml)) {
              throw new Error("Unexpected external Google Fonts request found in production HTML");
            }

            const y8ZipList = execSync("unzip -Z1 game-portal-release.zip", { encoding: "utf8" }).split(/\r?\n/);
            const cgZipList = execSync("unzip -Z1 crazygames-release.zip", { encoding: "utf8" }).split(/\r?\n/);
            if (!y8ZipList.includes("index.html")) {
              throw new Error("game-portal-release.zip missing index.html at ZIP root");
            }
            if (!cgZipList.includes("index.html")) {
              throw new Error("crazygames-release.zip missing index.html at ZIP root");
            }
            console.log("Verified Y8 and CrazyGames ZIP bundles pass all compliance checks.");
          '
          {
            echo "### Build & Portal Compliance Summary"
            echo "- TypeScript check (\`npm run lint\`): Passed"
            echo "- Unit tests (\`npm test\`): Passed"
            echo "- \`game-portal-release.zip\` (Y8 / GamePix / itch.io): Verified root \`index.html\`, relative \`./assets/\`, zero external SDKs"
            echo "- \`crazygames-release.zip\` (CrazyGames): Verified root \`index.html\`, relative \`./assets/\`, CrazyGames SDK v3 injected"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload game-portal-release.zip Artifact (Y8 / GamePix / itch.io)
        uses: actions/upload-artifact@v6
        with:
          name: game-portal-release
          path: game-portal-release.zip
          retention-days: 30

      - name: Upload crazygames-release.zip Artifact (With CrazyGames SDK v3)
        uses: actions/upload-artifact@v6
        with:
          name: crazygames-release
          path: crazygames-release.zip
          retention-days: 30

      - name: Check if GitHub Pages (GitHub Actions source) is enabled
        id: check_pages
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          BUILD_TYPE=$(echo "$BODY" | jq -r '.build_type // ""' 2>/dev/null || echo "")

          if [ "$STATUS" = "200" ] && [ "$BUILD_TYPE" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### GitHub Pages Skipped (Not Enabled Yet)" >> "$GITHUB_STEP_SUMMARY"
            echo "To enable automatic GitHub Pages deployment, open **Settings -> Pages** in this repository and set **Build and deployment -> Source** to **GitHub Actions**." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Your portal ZIP artifacts (\`game-portal-release\` and \`crazygames-release\`) were built and uploaded normally." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GitHub Pages Artifact
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to CrazyGames (if CRAZYGAMES_TOKEN is set)
        env:
          CRAZYGAMES_TOKEN: ${{ secrets.CRAZYGAMES_TOKEN }}
        run: |
          if [ -n "$CRAZYGAMES_TOKEN" ]; then
            npx @crazygames/sdk-cli upload --token "$CRAZYGAMES_TOKEN" --file crazygames-release.zip
          else
            echo "CRAZYGAMES_TOKEN not set, skipping CrazyGames CLI upload."
          fi

  deploy-pages:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
